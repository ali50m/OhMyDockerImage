name: Export Docker image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Public Docker image, for example nginx:latest"
        required: true
        type: string
      platform:
        description: "Target platform"
        required: true
        default: "linux/arm64"
        type: choice
        options:
          - linux/amd64
          - linux/arm64

jobs:
  export:
    name: Export ${{ inputs.image }} for ${{ inputs.platform }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.image }}
      PLATFORM: ${{ inputs.platform }}
    steps:
      - name: Set up Docker Engine 29.2 with containerd image store
        uses: docker/setup-docker-action@v5
        with:
          version: v29.2.0
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Show Docker environment
        run: |
          docker version
          docker info --format 'StorageDriver={{.Driver}}'
          docker info --format '{{json .DriverStatus}}'

      - name: Pull image
        run: docker pull --platform "$PLATFORM" "$IMAGE"

      - name: Read image ID
        id: image-info
        run: |
          image_id="$(docker image inspect --platform "$PLATFORM" --format '{{.Id}}' "$IMAGE")"
          image_id="${image_id#sha256:}"
          platform_suffix="${PLATFORM//\//-}"
          echo "artifact_name=docker-image-${platform_suffix}-sha256-${image_id}" >> "$GITHUB_OUTPUT"
          echo "Image ID: sha256:${image_id}"

      - name: Save image archive
        run: |
          mkdir -p docker-image
          platform_suffix="${PLATFORM//\//-}"
          docker image save --platform "$PLATFORM" --output "docker-image/${platform_suffix}.tar" "$IMAGE"

      - name: Upload image archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.image-info.outputs.artifact_name }}
          path: docker-image/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
